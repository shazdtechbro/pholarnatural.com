name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
      - '.github/vps_known_hosts'

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pholar_test
          POSTGRES_PASSWORD: ci-only-ephemeral-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pholar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:ci-only-ephemeral-password@127.0.0.1:5432/pholar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
        working-directory: server
      - run: python -m pytest
        working-directory: server
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with pinned VPS host keys
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_key_path=$(mktemp)
          trap 'rm -f "$ssh_key_path"' EXIT
          chmod 600 "$ssh_key_path"
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_key_path"
          ssh -i "$ssh_key_path" -p "${VPS_SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/.github/vps_known_hosts" \
            "$VPS_USERNAME@$VPS_HOST" 'bash -se' <<'DEPLOY'
          set -eu
          cd ~/pholarnatural.com/server
          git pull --ff-only origin main
          docker compose build api mail-worker
          docker compose run --rm --no-deps api alembic upgrade head < /dev/null
          docker compose up -d api mail-worker
          for attempt in $(seq 1 20); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:8000/health > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
          DEPLOY

