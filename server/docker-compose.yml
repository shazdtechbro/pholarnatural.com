services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pholar_db}
      POSTGRES_USER: ${POSTGRES_USER:-pholar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    # NOT exposed to host — only the api container can reach it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pholar} -d ${POSTGRES_DB:-pholar_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.4
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://163.245.192.116:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      # Fix: prevents "Couldn't link device" Baileys pairing handshake rejection
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1029193574
      - QRCODE_LIMIT=30
      # Separate DB avoids Prisma migration conflict (P3005) with pholar_natural
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/evolution_db
      # Redis is not running; use local cache to avoid reconnection error spam
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - LOG_LEVEL=ERROR
      - LOG_COLOR=false
      - DEL_INSTANCE=false
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  evolution_data:
